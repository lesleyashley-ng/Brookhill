name: Branch name check

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  check-branch-name:
    name: Verify branch name convention
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name follows convention
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feature|fix|chore|docs|refactor|test|ci)/.+"

          if ! echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "❌ Branch name '$BRANCH' does not follow the naming convention."
            echo ""
            echo "   Must start with one of: feature/, fix/, chore/, docs/, refactor/, test/, ci/"
            echo "   Example: feature/plinth-ingestion-script"
            exit 1
          fi

          echo "✅ Branch name '$BRANCH' is valid."
